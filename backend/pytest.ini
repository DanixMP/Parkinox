[pytest]
DJANGO_SETTINGS_MODULE = config.settings.development
python_files = tests.py test_*.py *_tests.py
python_classes = Test* *Test *Tests
python_functions = test_*
# Only collect tests from app directories and the tests/ folder
# Exclude root-level manual scripts (test_api.py, test_plates.py, etc.)
testpaths =
    accounts
    wallets
    plates
    parking
    reports
    utils
    tests
asyncio_mode = auto
