name: flutter_application_4
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.4 <4.0.0'
  flutter: '>=3.38.5'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  hux: ^1.2.0
  go_router: ^14.8.1
  flutter_riverpod: ^2.6.1
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  shamsi_date: ^1.1.1
  http: ^1.3.0
  google_nav_bar: ^5.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/iau_logo.png
    - assets/images/vector_rose.jpg

  fonts:
    - family: pinar
      fonts:
        - asset: assets/fonts/pinar-bold.ttf
          weight: 700
        - asset: assets/fonts/pinar-medium.ttf
          weight: 500
        - asset: assets/fonts/pinar-light.ttf
          weight: 300
    - family: iransans
      fonts:
        - asset: assets/fonts/iransans-regular.ttf
