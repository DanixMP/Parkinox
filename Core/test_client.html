<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parkinox - Plate Detection System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            border: 2px solid #fff;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        h1 {
            font-size: 2.5em;
            letter-spacing: 5px;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1em;
            letter-spacing: 2px;
            opacity: 0.7;
        }
        
        .server-status {
            border: 2px solid #fff;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #fff;
            margin-right: 10px;
        }
        
        .status-indicator.online {
            background: #fff;
            animation: pulse 2s infinite;
        }
        
        .status-indicator.offline {
            background: #333;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .panel {
            border: 2px solid #fff;
            padding: 20px;
        }
        
        .panel-title {
            font-size: 1.2em;
            letter-spacing: 3px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #fff;
        }
        
        .upload-area {
            border: 2px dashed #fff;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        
        .upload-area:hover {
            background: #111;
        }
        
        .upload-area.dragover {
            background: #222;
            border-style: solid;
        }
        
        .upload-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .btn {
            background: #fff;
            color: #000;
            border: 2px solid #fff;
            padding: 12px 30px;
            font-family: 'Courier New', monospace;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 2px;
            margin: 5px;
        }
        
        .btn:hover {
            background: #000;
            color: #fff;
        }
        
        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .btn-secondary {
            background: #000;
            color: #fff;
        }
        
        .btn-secondary:hover {
            background: #fff;
            color: #000;
        }
        
        .preview-area {
            display: none;
            text-align: center;
        }
        
        .preview-area.active {
            display: block;
        }
        
        .preview-image {
            max-width: 100%;
            max-height: 400px;
            border: 2px solid #fff;
            margin-bottom: 20px;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #333;
            border-top: 3px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .result-panel {
            border: 2px solid #fff;
            padding: 20px;
            display: none;
        }
        
        .result-panel.active {
            display: block;
        }
        
        .result-panel.success {
            border-color: #fff;
        }
        
        .result-panel.error {
            border-color: #666;
        }
        
        .plate-display {
            font-size: 3em;
            font-weight: bold;
            text-align: center;
            padding: 30px;
            border: 3px solid #fff;
            margin: 20px 0;
            direction: rtl;
            letter-spacing: 8px;
            background: #000;
            color: #fff;
        }
        
        .result-panel.error .plate-display {
            border-color: #666;
            color: #666;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .info-card {
            border: 1px solid #fff;
            padding: 15px;
            text-align: center;
        }
        
        .info-label {
            font-size: 0.8em;
            opacity: 0.7;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        
        .info-value {
            font-size: 1.5em;
            font-weight: bold;
            letter-spacing: 1px;
        }
        
        .api-output {
            border: 1px solid #fff;
            padding: 15px;
            margin-top: 20px;
            background: #111;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            overflow-x: auto;
        }
        
        .api-output-title {
            font-size: 0.9em;
            opacity: 0.7;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        
        .api-output pre {
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .endpoint-url {
            border: 1px solid #fff;
            padding: 10px;
            margin-top: 10px;
            background: #000;
            font-size: 0.85em;
            word-break: break-all;
        }
        
        .button-group {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>PARKINOX</h1>
            <div class="subtitle">FASTAPI PLATE DETECTION SYSTEM</div>
        </header>
        
        <div class="server-status">
            <div>
                <span class="status-indicator offline" id="statusDot"></span>
                <span id="statusText">CHECKING SERVER...</span>
            </div>
            <div id="serverTime">--:--:--</div>
        </div>
        
        <div class="main-grid">
            <div class="panel">
                <div class="panel-title">INPUT</div>
                
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">▢</div>
                    <div>DROP IMAGE OR CLICK TO UPLOAD</div>
                    <div style="margin-top: 10px; opacity: 0.5; font-size: 0.9em;">JPG | PNG | BMP</div>
                    <input type="file" id="fileInput" accept="image/*">
                </div>
                
                <div class="preview-area" id="previewArea">
                    <img id="previewImage" class="preview-image" alt="Preview">
                    <div class="button-group">
                        <button class="btn" id="detectBtn">▶ DETECT</button>
                        <button class="btn btn-secondary" id="clearBtn">✕ CLEAR</button>
                    </div>
                </div>
                
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <div>PROCESSING...</div>
                </div>
            </div>
            
            <div class="panel">
                <div class="panel-title">OUTPUT</div>
                
                <div id="noResult" style="text-align: center; padding: 60px 20px; opacity: 0.3;">
                    NO DETECTION YET
                </div>
                
                <div class="result-panel" id="resultPanel">
                    <div class="plate-display" id="plateDisplay"></div>
                    
                    <div class="info-grid">
                        <div class="info-card">
                            <div class="info-label">CONFIDENCE</div>
                            <div class="info-value" id="confidence">-</div>
                        </div>
                        <div class="info-card">
                            <div class="info-label">CHAR CONF</div>
                            <div class="info-value" id="charConfidence">-</div>
                        </div>
                        <div class="info-card">
                            <div class="info-label">CHARACTERS</div>
                            <div class="info-value" id="numChars">-</div>
                        </div>
                        <div class="info-card">
                            <div class="info-label">BBOX</div>
                            <div class="info-value" id="bbox" style="font-size: 0.7em;">-</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="panel" id="apiPanel" style="display: none;">
            <div class="panel-title">API RESPONSE</div>
            
            <div class="endpoint-url">
                <strong>ENDPOINT:</strong> POST http://localhost:8000/detect
            </div>
            
            <div class="api-output">
                <div class="api-output-title">JSON OUTPUT:</div>
                <pre id="apiOutput"></pre>
            </div>
        </div>
    </div>
    
    <script>
        const API_URL = 'http://localhost:8000';
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewArea = document.getElementById('previewArea');
        const previewImage = document.getElementById('previewImage');
        const detectBtn = document.getElementById('detectBtn');
        const clearBtn = document.getElementById('clearBtn');
        const loading = document.getElementById('loading');
        const noResult = document.getElementById('noResult');
        const resultPanel = document.getElementById('resultPanel');
        const plateDisplay = document.getElementById('plateDisplay');
        const confidence = document.getElementById('confidence');
        const charConfidence = document.getElementById('charConfidence');
        const numChars = document.getElementById('numChars');
        const bbox = document.getElementById('bbox');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const serverTime = document.getElementById('serverTime');
        const apiPanel = document.getElementById('apiPanel');
        const apiOutput = document.getElementById('apiOutput');
        
        let selectedFile = null;
        
        // Update time
        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('en-US', { hour12: false });
            serverTime.textContent = timeStr;
        }
        updateTime();
        setInterval(updateTime, 1000);
        
        // Check server health
        async function checkServerHealth() {
            try {
                const response = await fetch(`${API_URL}/health`);
                const data = await response.json();
                
                if (data.status === 'ok' && data.models_loaded) {
                    statusDot.className = 'status-indicator online';
                    statusText.textContent = 'SERVER ONLINE | MODELS LOADED';
                } else {
                    statusDot.className = 'status-indicator offline';
                    statusText.textContent = 'SERVER ONLINE | MODELS NOT LOADED';
                }
            } catch (error) {
                statusDot.className = 'status-indicator offline';
                statusText.textContent = 'SERVER OFFLINE';
            }
        }
        
        checkServerHealth();
        setInterval(checkServerHealth, 5000);
        
        // Upload area click
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });
        
        // File input change
        fileInput.addEventListener('change', (e) => {
            handleFile(e.target.files[0]);
        });
        
        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFile(e.dataTransfer.files[0]);
        });
        
        // Handle file
        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) {
                alert('INVALID FILE TYPE');
                return;
            }
            
            selectedFile = file;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                previewArea.classList.add('active');
                noResult.style.display = 'block';
                resultPanel.classList.remove('active');
                resultPanel.className = 'result-panel';
                apiPanel.style.display = 'none';
            };
            reader.readAsDataURL(file);
        }
        
        // Detect button
        detectBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            
            loading.classList.add('active');
            detectBtn.disabled = true;
            noResult.style.display = 'none';
            resultPanel.classList.remove('active');
            apiPanel.style.display = 'none';
            
            try {
                const formData = new FormData();
                formData.append('image', selectedFile);
                
                const response = await fetch(`${API_URL}/detect`, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                console.log('API Response:', data);
                
                loading.classList.remove('active');
                detectBtn.disabled = false;
                
                // Show API output
                apiOutput.textContent = JSON.stringify(data, null, 2);
                apiPanel.style.display = 'block';
                
                if (data.success) {
                    plateDisplay.textContent = data.plate || 'N/A';
                    confidence.textContent = data.confidence ? (data.confidence * 100).toFixed(1) + '%' : '-';
                    charConfidence.textContent = data.char_confidence ? (data.char_confidence * 100).toFixed(1) + '%' : '-';
                    numChars.textContent = data.num_characters || '-';
                    bbox.textContent = data.bbox && data.bbox.length > 0 ? `[${data.bbox.join(', ')}]` : '-';
                    resultPanel.className = 'result-panel success active';
                } else {
                    plateDisplay.textContent = data.message || 'NO PLATE DETECTED';
                    confidence.textContent = data.confidence ? (data.confidence * 100).toFixed(1) + '%' : '0%';
                    charConfidence.textContent = data.char_confidence ? (data.char_confidence * 100).toFixed(1) + '%' : '0%';
                    numChars.textContent = data.num_characters || '0';
                    bbox.textContent = '-';
                    resultPanel.className = 'result-panel error active';
                }
            } catch (error) {
                loading.classList.remove('active');
                detectBtn.disabled = false;
                console.error('Error:', error);
                
                plateDisplay.textContent = 'ERROR: ' + error.message;
                resultPanel.className = 'result-panel error active';
                
                apiOutput.textContent = JSON.stringify({
                    error: error.message,
                    success: false
                }, null, 2);
                apiPanel.style.display = 'block';
            }
        });
        
        // Clear button
        clearBtn.addEventListener('click', () => {
            selectedFile = null;
            fileInput.value = '';
            previewArea.classList.remove('active');
            noResult.style.display = 'block';
            resultPanel.classList.remove('active');
            resultPanel.className = 'result-panel';
            apiPanel.style.display = 'none';
        });
    </script>
</body>
</html>
