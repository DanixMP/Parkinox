name: parkinox_sec_op
description: Parkinox Security Operator Panel — camera monitoring & plate alerts
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.9.2 <4.0.0'
  flutter: '>=3.35.3'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  web_socket_channel: ^3.0.1
  dio: ^5.7.0
  http: ^1.1.0
  shared_preferences: ^2.3.3
  camera: ^0.11.0+2
  camera_windows: ^0.2.3
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_windows_video: ^1.0.11
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  intl: ^0.20.2
  shamsi_date: ^1.0.1
  uuid: ^4.5.1
  logger: ^2.4.0
  go_router: ^14.6.2
  path: ^1.9.0
  path_provider: ^2.1.5
  http_parser: ^4.1.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo/
    - assets/images/plates/
    - assets/fonts/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
